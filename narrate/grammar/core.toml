[symbols]
greeting = ["Well met.", "Traveller.", "Hm.", "Greetings, young hero.", "Another wanderer, is it?", "Mind your step."]
look = ["looks you over", "eyes you warily", "offers a shallow bow", "barely glances up", "studies your hands for calluses", "sizes up your stance"]
remember = ["You again.", "I remember your face.", "Back so soon?", "The world is small, it seems.", "Ah, it's you."]
farewell = ["May the heavens favour your path.", "Walk carefully.", "Don't make trouble here.", "Until the rivers meet again.", "Go well."]
road = ["dusty", "rutted", "winding", "rain-slick", "bandit-haunted", "quiet", "pilgrim-worn"]
wind = ["A cold wind", "A warm breeze", "A restless wind", "Still air", "A thin drizzle"]
shrug = ["shrugs", "sighs", "rubs the back of their neck", "spreads their hands", "snorts"]
hush = ["lowers their voice", "glances over their shoulder", "leans in", "taps the side of their nose"]
impatience = ["gives you a flat look", "raises an eyebrow", "sighs through their nose", "folds their arms", "chuckles despite themself"]
told_you = ["As I said,", "I told you already:", "Same answer as before:", "Were you not listening?", "Again?"]
sound = ["a dog barks somewhere", "a cart creaks past", "someone is haggling loudly", "wind chimes clink", "a child runs by laughing"]
sky = ["under a pale sky", "under low cloud", "in clear light", "beneath drifting mist"]
dismiss = ["Go bother someone else.", "We are done here.", "I have work to do.", "Ask the wind next time."]
warning = ["Try not to ask me the same thing five times today.", "I hope you listen better this time.", "Ask what you need, once.", "Keep it short.", "No riddles, no repeats."]

[began]
colour = "gold"
lines = [
  "Your story begins in {town}, in the {season} of the first year. You carry little but a name: {player}.",
  "{player} arrives in {town} with empty pockets and a head full of legends. The martial world waits.",
]

[met]
colour = "npc"
lines = [
  "{npc_full}, a {trait} {occupation}, #look#. \"#greeting# The name is {npc_full}.\"",
  "A {trait} {occupation} #look#. \"#greeting#\" They give their name as {npc_full}.",
]

[conversed]
colour = "npc"
lines = [
  "{npc} #look#. \"#remember# We first spoke in {first_met_season}, did we not?\"",
  "\"#remember#\" says {npc}. It is the {times_ordinal} time the two of you have spoken.",
]

["asked.work"]
colour = "npc"
lines = [
  "\"Work? I am a {occupation}. It feeds me, mostly,\" says {npc}, and #sound#.",
  "{npc} #shrug#. \"A {occupation}'s life. The sect people never pay what they owe.\"",
]

["asked.work.again"]
colour = "npc"
lines = [
  "{npc} #impatience#. \"#told_you# I am a {occupation}. That has not changed.\"",
  "\"#told_you# {occupation},\" {npc} says. \"Ask me something new.\"",
]

["asked.town"]
colour = "npc"
lines = [
  "\"{town}? A {kind} of {region}. Quiet, until it isn't,\" says {npc}, as #sound#.",
  "{npc} #hush#. \"{town} looks peaceful. Every {kind} in {region} does, from the outside.\"",
]

["asked.town.again"]
colour = "npc"
lines = [
  "{npc} #impatience#. \"#told_you# {town} is a {kind}. It is still a {kind}.\"",
  "\"#told_you# nothing here changes quickly,\" {npc} says of {town}.",
]

["conversed.annoyed"]
colour = "npc"
lines = [
  "{npc} #look#, unsmiling. \"You again. #warning#\"",
  "\"Oh. It's you,\" {npc} says flatly. \"#warning#\"",
]

[lost_patience]
colour = "npc"
lines = [
  "{npc} #impatience#. \"Enough. #dismiss#\" They turn their back on you.",
  "\"#told_you# I have answered you. #dismiss#\" {npc} walks away.",
]

[parted]
colour = "npc"
lines = [
  "\"#farewell#\" {npc} turns back to their business.",
  "{npc} nods. \"#farewell#\"",
]

[travelled]
colour = "default"
lines = [
  "You take the #road# road for {days}. As {watch} comes on, you reach {dest}.",
  "After {days} on the #road# road, {dest} rises ahead of you #sky#.",
]

["scene.plains"]
lines = [
  "{town} sits among open fields. #wind# moves through the {season} grain this {watch}.",
  "Flat land runs to the horizon around {town} #sky#. Farmers bend in the fields and #sound#.",
]

["scene.mountains"]
lines = [
  "{town} clings to a mountainside #sky#. Mist pours between the peaks this {season} {watch}.",
  "Stone steps wind up through {town}. Somewhere above a sect bell rings, and #sound#.",
]

["scene.river"]
lines = [
  "Boats crowd the docks of {town} #sky#. The river runs broad and brown this {season} {watch}.",
  "{town} straddles the river. Ferrymen shout prices across the water and #sound#.",
]

["scene.forest"]
lines = [
  "{town} huddles beneath old trees. #wind# stirs the {season} canopy this {watch}.",
  "Woodcutters stack timber at the edge of {town} #sky#; #sound#.",
]

["scene.marsh"]
lines = [
  "{town} stands on stilts above the reeds #sky#. Frogs drone through the {season} {watch}.",
  "Plank walkways link the houses of {town}. The marsh smells of rot and lotus, and #sound#.",
]

["scene.hills"]
lines = [
  "{town} rolls over green hills. Tea terraces catch the {season} light #sky#.",
  "Goat paths criss-cross the hills around {town}. #wind# carries woodsmoke this {watch}.",
]
